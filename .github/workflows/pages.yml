name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/afc17010-artin
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # اگر Pages در تنظیمات مخزن فعال نشده باشد، خودش فعال می‌کند
          enablement: true

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/
          # فایل صوتی دارای حق نشر هرگز منتشر نمی‌شود
          rm -f _site/assets/audio/*.mp3 _site/assets/audio/*.m4a _site/assets/audio/*.wav
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
